syntax = "proto3";

package fnknock.v1;

option go_package = "go-reauth-proxy/pkg/grpc/pb;pb";

import "google/protobuf/empty.proto";

// Single source of truth for the Rust/Go gateway compatibility contract.
// Generated clients and packaging tools consume this stable enum member.
enum ControlApiVersion {
  CONTROL_API_VERSION_UNSPECIFIED = 0;
  CONTROL_API_VERSION_CURRENT = 16;
}

message RpcStatus {
  bool success = 1;
  int32 code = 2;
  string message = 3;
}

message Header {
  string name = 1;
  repeated string values = 2;
}

message HeaderList {
  repeated Header headers = 1;
}

message BasicAuthConfig {
  bool enabled = 1;
  string username = 2;
  string password = 3;
}

message HostLocationResponse {
  int32 status = 1;
  string content_type = 2;
  map<string, string> headers = 3;
  string body = 4;
}

message HostLocation {
  string path = 1;
  string match = 2;
  string action = 3;
  string target = 4;
  bool strip_path = 5;
  bool rewrite_html = 6;
  HostLocationResponse response = 7;
}

message HostRuleAvailability {
  bool enabled = 1;
  string start_time = 2;
  string end_time = 3;
}

message HostRuleVisibility {
  string mode = 1;
  // Deprecated compatibility input. New control planes send policy_id and
  // publish the referenced CompiledIpSet in HostRules.visibility_policies.
  repeated string cidrs = 2 [deprecated = true];
  string policy_id = 3;
}

// Exact, immutable IP set encoded as sorted, disjoint inclusive ranges.
// The canonical IPv4 representation concatenates start(4 bytes) + end(4 bytes)
// and IPv6 uses start(16 bytes) + end(16 bytes), all in network byte order.
// Format version 1 transports those canonical bytes directly. Format version
// 2 transports each byte stream as zlib data while the content ID continues to
// cover the uncompressed canonical representation.
message CompiledIpSet {
  string id = 1;
  uint32 format_version = 2;
  bytes ipv4_ranges = 3;
  bytes ipv6_ranges = 4;
}

// Advanced authentication rules are compiled by the control plane before they
// are sent to the gateway. Region selectors are deliberately absent here:
// source_ip/source_region normally reference the shared compiled policy table.
// cidrs is retained only while importing legacy control-plane snapshots.
message AdvancedAuthCondition {
  string id = 1;
  string target = 2;
  string operator = 3;
  string name = 4;
  repeated string values = 5;
  repeated string cidrs = 6 [deprecated = true];
  string policy_id = 7;
}

message AdvancedAuthGroup {
  string id = 1;
  repeated AdvancedAuthCondition conditions = 2;
}

message AdvancedAuthConfig {
  bool enabled = 1;
  int64 idle_ttl_seconds = 2;
  int64 max_lifetime_seconds = 3;
  string policy_version = 4;
  repeated AdvancedAuthGroup groups = 5;
}

message Rule {
  string path = 1;
  string target = 2;
  bool use_auth = 3;
  bool strip_path = 4;
  bool rewrite_html = 5;
  bool use_root_mode = 6;
}

message HostRule {
  string host = 1;
  string target = 2;
  bool use_auth = 3;
  string access_mode = 4;
  bool suppress_toolbar = 5;
  bool preserve_host = 6;
  bool is_default = 7;
  string title = 8;
  string favicon = 9;
  BasicAuthConfig basic_auth = 10;
  repeated HostLocation locations = 11;
  bool disabled = 12;
  HostRuleAvailability availability = 13;
  string protocol_mode = 14;
  HostRuleVisibility visibility = 15;
  AdvancedAuthConfig advanced_auth = 16;
  optional string group_id = 17;
  optional string group_name = 18;
  string target_path_mode = 19;
  string website_icon_path = 20;
}

message StreamRule {
  string protocol = 1;
  int32 listen_port = 2;
  string target = 3;
  bool use_auth = 4;
  bool disabled = 5;
  string validation_mode = 6;
  StreamServiceProfile service_profile = 7;
  StreamBypassPolicy bypass_policy = 8;
  string probe_status = 9;
}

// A normalized application-service observation. The gateway only emits
// controlled evidence codes; raw probe or session payloads are never exposed.
message StreamServiceProfile {
  string service_id = 1;
  string service_family = 2;
  string device_role = 3;
  string service_confidence = 4;
  string role_confidence = 5;
  string source = 6;
  string observed_at = 7;
  string classifier_version = 8;
  string target_fingerprint = 9;
  repeated string evidence_codes = 10;
  bool strict_capable = 11;
  map<string, string> metadata = 12;
}

message StreamBypassCondition {
  string id = 1;
  string target = 2;
  string operator = 3;
  // Deprecated compatibility input. New control planes compile selectors
  // into StreamRules.access_policies and send only policy_id.
  repeated string cidrs = 4 [deprecated = true];
  string policy_id = 5;
}

message StreamBypassGroup {
  string id = 1;
  repeated StreamBypassCondition conditions = 2;
}

message StreamBypassPolicy {
  bool enabled = 1;
  string policy_version = 2;
  repeated StreamBypassGroup groups = 3;
  bool broad_rule_confirmed = 4;
}

message StreamProbeRequest {
  string protocol = 1;
  string target = 2;
}

message StreamProbeResult {
  string status = 1;
  StreamServiceProfile profile = 2;
  string message = 3;
}

message StreamServiceDescriptor {
  string service_id = 1;
  string display_name = 2;
  string service_family = 3;
  repeated string transports = 4;
  bool active_probe_supported = 5;
  bool strict_capable = 6;
}

message StreamServiceCatalog {
  string classifier_version = 1;
  repeated StreamServiceDescriptor items = 2;
}

message StreamAvailability {
  bool enabled = 1;
  string start_time = 2;
  string end_time = 3;
}

message AuthConfig {
  int32 auth_port = 1;
  string auth_url = 2;
  string login_url = 3;
  string logout_url = 4;
  string preflight_url = 5;
  int32 auth_cache_ttl_seconds = 6;
  int32 auth_cache_unauthorized_ttl_seconds = 7;
  bool edge_client_ip_enabled = 8;
  bool aliyun_esa_enabled = 9;
