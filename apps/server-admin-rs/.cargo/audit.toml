# Raw cargo audit reports all findings, including RUSTSEC-2023-0071.
# The repository gate in scripts/security-audit.mjs accepts only reviewed,
# exact package versions. WebAuthn uses public-key verification; russh also
# signs with user-supplied RSA private keys and retains a timing-side-channel
# risk. Prefer Ed25519. No fixed RSA release is currently available.
[advisories]
ignore = []
