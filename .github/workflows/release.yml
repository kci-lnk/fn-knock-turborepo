name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fn-knock-stable-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FN_KNOCK_DOCKER_IMAGE_REPO: kcilnk/fn-knock
  NODE_VERSION: "22.22.3"
  NPM_VERSION: "10.8.2"
  PROTOC_VERSION: "35.1"
  PROTOC_LINUX_X86_64_SHA256: "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7"
  RUST_VERSION: "1.96.0"
  ZIG_VERSION: "0.16.0"
  ZIG_LINUX_X86_64_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  CARGO_ZIGBUILD_VERSION: "0.22.3"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      release_channel: ${{ steps.contract.outputs.release_channel }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      control_api_version: ${{ steps.contract.outputs.control_api_version }}
      source_sha: ${{ steps.source.outputs.sha }}
      go_sha: ${{ steps.gateway.outputs.sha }}

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Validate release contract
        id: contract
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(jq -r .version version.json)"
          fi
          bash ./scripts/release-preflight.sh "${tag}"

      - name: Refuse to overwrite a published release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "${state}" = "true" ] || {
              echo "Published release ${GITHUB_REF_NAME} already exists; refusing to rebuild it" >&2
              exit 1
            }
          fi

      - name: Freeze source commit
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"

      - name: Freeze Go gateway main commit
        id: gateway
        shell: bash
        run: |
          sha="$(git ls-remote https://github.com/kci-lnk/Go-Reauth-Proxy.git refs/heads/main | awk '{print $1}')"
          printf '%s\n' "${sha}" | grep -Eq '^[0-9a-f]{40}$'
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"
          printf 'Go-Reauth-Proxy/main -> %s\n' "${sha}"

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FN_KNOCK_GO_SOURCE_COMMIT: ${{ needs.preflight.outputs.go_sha }}
      FN_KNOCK_GO_REAUTH_PROXY_DIR: ${{ github.workspace }}/Go-Reauth-Proxy
      FN_KNOCK_RUSTSEC_ADVISORY_DB: ${{ github.workspace }}/rustsec-advisory-db
      # Update deliberately after reviewing new advisories to keep release audits reproducible.
      RUSTSEC_ADVISORY_DB_REVISION: 309ad29d8fe448bf986019e05d47b9e0e29a2218

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout frozen Go gateway
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kci-lnk/Go-Reauth-Proxy
          path: Go-Reauth-Proxy
          ref: ${{ env.FN_KNOCK_GO_SOURCE_COMMIT }}
          persist-credentials: false

      - name: Checkout frozen RustSec advisory database
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RustSec/advisory-db
          path: rustsec-advisory-db
          ref: ${{ env.RUSTSEC_ADVISORY_DB_REVISION }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify frozen Go gateway version and control API contract
        run: >-
          node ./scripts/fn-knock-release.mjs
          gateway-check
          ${{ needs.preflight.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go-Reauth-Proxy/go.mod
          cache-dependency-path: Go-Reauth-Proxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Set up protobuf compiler
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          install_dir="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          printf '%s  %s\n' "${PROTOC_LINUX_X86_64_SHA256}" "${archive}" |
            sha256sum --check -
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          printf '%s\n' "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/protoc" --version

      - name: Install locked build tools
        shell: bash
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Run static and release quality gates
        run: |
          npm run security:audit
          npm run lint
          npm run check-types
          npm run fn-knock:release:test

      - name: Verify generated Go control-plane stubs
        shell: bash
        run: |
          bash ./scripts/sync-go-grpc-contract.sh Go-Reauth-Proxy
          git -C Go-Reauth-Proxy diff --exit-code -- pkg/grpc/pb

  build-common:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FN_KNOCK_GO_SOURCE_COMMIT: ${{ needs.preflight.outputs.go_sha }}
      FN_KNOCK_VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout frozen Go gateway
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kci-lnk/Go-Reauth-Proxy
          path: Go-Reauth-Proxy
          ref: ${{ env.FN_KNOCK_GO_SOURCE_COMMIT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go-Reauth-Proxy/go.mod
          cache-dependency-path: Go-Reauth-Proxy/go.sum

      - name: Build shared frontends and Go binaries
        shell: bash
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci
          npx turbo run build --filter=server-admin-view --filter=server-auth-view
          FN_KNOCK_GO_SKIP_TESTS=1 \
            bash ./scripts/build-go-release.sh \
              "${GITHUB_WORKSPACE}/Go-Reauth-Proxy" \
              "${GITHUB_WORKSPACE}/dist/fn-knock-go-release"

      - name: Stage common runtime
        shell: bash
        run: |
          runtime="dist/fn-knock-artifacts/runtime"
          mkdir -p \
            "${runtime}/ui/www" \
            "${runtime}/server-auth-view/dist" \
            "${runtime}/server/server-admin/resources" \
            "${runtime}/server"
          rsync -a apps/server-admin-view/dist/ "${runtime}/ui/www/"
          rsync -a apps/server-auth-view/dist/ "${runtime}/server-auth-view/dist/"
          cp apps/server-admin-rs/resources/acmesh.zip "${runtime}/server/server-admin/resources/acmesh.zip"
          for arch in amd64 arm64 arm; do
            cp "dist/fn-knock-go-release/go-reauth-proxy-linux-${arch}" "${runtime}/server/"
            cp "dist/fn-knock-go-release/go-reauth-proxy-linux-${arch}.version" "${runtime}/server/"
          done
          tar -czf release-build-common.tar.gz \
            dist/fn-knock-artifacts/runtime \
            dist/fn-knock-go-release

      - name: Upload common build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-common
          path: release-build-common.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-rust-gnu:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up Zig
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          install_dir="${RUNNER_TEMP}/zig-${ZIG_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${archive}" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          printf '%s  %s\n' "${ZIG_LINUX_X86_64_SHA256}" "${archive}" |
            sha256sum --check -
          mkdir -p "${install_dir}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/zig" version

      - name: Build GNU Rust backend
        shell: bash
        run: |
          cargo install cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}" --locked
          output="${GITHUB_WORKSPACE}/dist/fn-knock-artifacts/fpk-rust-backends/server-admin-rs-linux-${{ matrix.arch }}"
          bash ./scripts/build-rust-backend.sh gnu "${{ matrix.arch }}" "${output}"
          tar -czf "release-build-rust-gnu-${{ matrix.arch }}.tar.gz" \
            "dist/fn-knock-artifacts/fpk-rust-backends/server-admin-rs-linux-${{ matrix.arch }}"

      - name: Upload GNU Rust backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-rust-gnu-${{ matrix.arch }}
          path: release-build-rust-gnu-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-rust-musl:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, arm]

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Build musl Rust backend
        shell: bash
        run: |
          output="${GITHUB_WORKSPACE}/dist/fn-knock-artifacts/musl-rust-backends/server-admin-rs-linux-${{ matrix.arch }}"
          bash ./scripts/build-rust-backend.sh musl "${{ matrix.arch }}" "${output}"
          tar -czf "release-build-rust-musl-${{ matrix.arch }}.tar.gz" \
            "dist/fn-knock-artifacts/musl-rust-backends/server-admin-rs-linux-${{ matrix.arch }}"

      - name: Upload musl Rust backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-rust-musl-${{ matrix.arch }}
          path: release-build-rust-musl-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows-unsigned:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      FN_KNOCK_GO_SOURCE_COMMIT: ${{ needs.preflight.outputs.go_sha }}
      FN_KNOCK_RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout frozen Go gateway
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kci-lnk/Go-Reauth-Proxy
          path: Go-Reauth-Proxy
          ref: ${{ env.FN_KNOCK_GO_SOURCE_COMMIT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go-Reauth-Proxy/go.mod
          cache-dependency-path: Go-Reauth-Proxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Restore Windows Rust build cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: windows-x86_64
          add-job-id-key: "false"
          cache-bin: "false"
          workspaces: |
            apps/server-admin-rs -> target
            apps/fn-knock-desktop/native -> target

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          npm ci
          choco install nsis --no-progress -y

      - name: Build unsigned native runtime and NSIS installer
        shell: pwsh
        run: >-
          ./scripts/fn-knock-windows.ps1
          -Mode Build
          -BundleInstaller
          -SkipChecks
          -RequireCleanTree
          -GoRepository "${{ github.workspace }}\Go-Reauth-Proxy"

      - name: Finalize unsigned installer metadata
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\windows\fn-knock-*-windows-x86_64-unsigned-setup.exe").Path
          ./scripts/fn-knock-windows-finalize.ps1 -SetupPath $setup -SignaturePolicy Unsigned

      - name: Archive Windows release inputs
        shell: pwsh
        run: tar -czf windows-release.tar.gz -C dist/fn-knock-artifacts/windows/x86_64 .

      - name: Upload Windows release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-assets
          path: windows-release.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: [preflight, build-common]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            protoc_asset: osx-x86_64
            protoc_sha256: 537d73604a344ded6fc94e98e07e529d4fe3e4a0b09e59905353950fafc2a1f7
          - arch: arm64
            runner: macos-15
            protoc_asset: osx-aarch_64
            protoc_sha256: 193289af0470c6a1aada357d4fba0bbf8d78bfaac8b5e42ca30af2ef75583de2
    runs-on: ${{ matrix.runner }}
    env:
      FN_KNOCK_GO_SOURCE_COMMIT: ${{ needs.preflight.outputs.go_sha }}
      FN_KNOCK_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_sha }}
      FN_KNOCK_VERSION: ${{ needs.preflight.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout frozen Go gateway
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kci-lnk/Go-Reauth-Proxy
          path: Go-Reauth-Proxy
          ref: ${{ env.FN_KNOCK_GO_SOURCE_COMMIT }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go-Reauth-Proxy/go.mod
          cache-dependency-path: Go-Reauth-Proxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Restore macOS Rust build cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: macos-${{ matrix.arch }}
          add-job-id-key: "false"
          cache-bin: "false"
          workspaces: . -> dist/macos-build-${{ matrix.arch }}/cargo-target

      - name: Set up verified protobuf compiler
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}-${{ matrix.protoc_asset }}.zip"
          install_dir="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${{ matrix.protoc_asset }}.zip"
          printf '%s  %s\n' "${{ matrix.protoc_sha256 }}" "${archive}" | shasum -a 256 --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          printf '%s\n' "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/protoc" --version

      - name: Download common runtime assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-common
          path: downloads

      - name: Build native unsigned macOS package
        shell: bash
        run: |
          tar -xzf downloads/release-build-common.tar.gz
          FN_KNOCK_GO_SKIP_TESTS=1 \
            bash ./scripts/fn-knock-macos-package.sh \
              "${{ matrix.arch }}" \
              "${GITHUB_WORKSPACE}/dist/fn-knock-artifacts/runtime" \
              "${GITHUB_WORKSPACE}/Go-Reauth-Proxy" \
              "${GITHUB_WORKSPACE}/dist/fn-knock-macos"
          bash ./scripts/fn-knock-macos-smoke.sh \
            "dist/fn-knock-macos/fn-knock-macos-${FN_KNOCK_VERSION}-${{ matrix.arch }}.tar.gz"
          bash ./deploy/macos/tests/test-macos-management.sh
          sudo env CI=true GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            bash ./scripts/fn-knock-macos-launchd-smoke.sh \
              "${GITHUB_WORKSPACE}/dist/fn-knock-macos/fn-knock-macos-${FN_KNOCK_VERSION}-${{ matrix.arch }}.tar.gz"
          [ "$(find dist/fn-knock-macos -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1" ]
          tar -czf "release-macos-${{ matrix.arch }}-assets.tar.gz" \
            -C dist/fn-knock-macos .

      - name: Upload macOS release input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}-assets
          path: release-macos-${{ matrix.arch }}-assets.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [preflight, build-common, build-rust-gnu, build-rust-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download prebuilt inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: downloads
          merge-multiple: true

      - name: Restore prebuilt inputs
        shell: bash
        run: |
          for archive in downloads/*.tar.gz; do
            tar -xzf "${archive}"
          done

      - name: Install verified fnpack
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            --output "${RUNNER_TEMP}/fnpack"
          printf '%s  %s\n' \
            54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93 \
            "${RUNNER_TEMP}/fnpack" | sha256sum --check
          chmod 755 "${RUNNER_TEMP}/fnpack"

      - name: Assemble Linux, multi-architecture NAS, and OpenWrt release assets
        env:
          FN_KNOCK_FNPACK_BIN: ${{ runner.temp }}/fnpack
        run: bash ./scripts/fn-knock-assemble-release.sh

      - name: Archive assembled release assets
        shell: bash
        run: tar -czf release-linux-assets.tar.gz -C dist/release-assets .

      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-assets
          path: release-linux-assets.tar.gz
          if-no-files-found: error
          retention-days: 14

  docker-arch:
    needs: [preflight, build-common, build-rust-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: arm32
            platform: linux/arm/v7

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Download common and musl inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: downloads
          merge-multiple: true

      - name: Stage Docker build context
        shell: bash
        run: |
          for archive in downloads/release-build-common.tar.gz downloads/release-build-rust-musl-*.tar.gz; do
            tar -xzf "${archive}"
          done
          FN_KNOCK_PREBUILT_ONLY=1 \
          FN_KNOCK_RUNTIME_GATEWAY_ARCHES="amd64 arm64 arm" \
          FN_KNOCK_MUSL_ARCHES="amd64 arm64 arm" \
            bash ./scripts/fn-knock-prepare-artifacts.sh docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.FN_KNOCK_DOCKER_IMAGE_REPO }}:${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          outputs: ${{ github.event_name == 'workflow_dispatch' && format('type=oci,dest=/tmp/fn-knock-{0}.tar', matrix.arch) || '' }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Upload dry-run OCI image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-docker-${{ matrix.arch }}
          path: /tmp/fn-knock-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  docker-manifest:
    if: github.event_name == 'push'
    needs: [preflight, docker-arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.verify.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and verify version manifest
        id: verify
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.version }}"
          image="${FN_KNOCK_DOCKER_IMAGE_REPO}"
          docker buildx imagetools create \
            -t "${image}:${version}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64" \
            "${image}:${version}-arm32"
          inspect="$(docker buildx imagetools inspect "${image}:${version}")"
          printf '%s\n' "${inspect}"
          printf '%s\n' "${inspect}" | grep -q 'linux/amd64'
          printf '%s\n' "${inspect}" | grep -q 'linux/arm64'
          printf '%s\n' "${inspect}" | grep -q 'linux/arm/v7'
          digest="$(printf '%s\n' "${inspect}" | awk '/^Digest:/ {print $2; exit}')"
          printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

  publish:
    needs:
      [preflight, quality, assemble, windows-unsigned, macos, docker-manifest]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.assemble.result == 'success' &&
      needs.windows-unsigned.result == 'success' &&
      needs.macos.result == 'success' &&
      (github.event_name != 'push' || needs.docker-manifest.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked publishing dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-assets
          path: downloads
          merge-multiple: true

      - name: Finalize release inventory and checksums
        env:
          FN_KNOCK_VERSION: ${{ needs.preflight.outputs.version }}
          FN_KNOCK_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          FN_KNOCK_RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
          FN_KNOCK_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_sha }}
          FN_KNOCK_GO_SOURCE_COMMIT: ${{ needs.preflight.outputs.go_sha }}
          FN_KNOCK_CONTROL_API_VERSION: ${{ needs.preflight.outputs.control_api_version }}
          FN_KNOCK_DOCKER_IMAGE: ${{ env.FN_KNOCK_DOCKER_IMAGE_REPO }}
          FN_KNOCK_DOCKER_DIGEST: ${{ needs.docker-manifest.outputs.digest }}
          FN_KNOCK_REQUIRE_DOCKER: ${{ github.event_name == 'push' && '1' || '0' }}
        shell: bash
        run: |
          mkdir -p dist/release-assets
          for archive in downloads/*.tar.gz; do
            tar -xzf "${archive}" -C dist/release-assets
          done
          mkdir -p "${RUNNER_TEMP}/fn-knock-windows-release"
          tar -xzf downloads/windows-release.tar.gz \
            -C "${RUNNER_TEMP}/fn-knock-windows-release"
          node ./scripts/fn-knock-release-finalize.mjs dist/release-assets
          jq -r '.artifacts[].name, .metadata_files[]' \
            dist/release-assets/release-manifest.json | sort > /tmp/manifest-assets
          find dist/release-assets -maxdepth 1 -type f -exec basename {} \; |
            sort > /tmp/directory-assets
          diff -u /tmp/manifest-assets /tmp/directory-assets

      - name: Read previous GitHub Release notes
        if: needs.preflight.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh api
          "repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          > "${RUNNER_TEMP}/fn-knock-releases.json"

      - name: Validate Tencent COS publish plan
        if: needs.preflight.outputs.prerelease != 'true'
        env:
          COS_PUBLICBASICURL: ${{ vars.COS_PUBLICBASICURL || secrets.COS_PUBLICBASICURL }}
          FN_KNOCK_COS_OUTPUT_DIR: ${{ github.workspace }}/dist/cos-publish
          FN_KNOCK_INSTALL_SCRIPT: ${{ github.workspace }}/deploy/linux/install.sh
          FN_KNOCK_MACOS_INSTALL_SCRIPT: ${{ github.workspace }}/deploy/macos/install.sh
          FN_KNOCK_RELEASE_ASSETS_DIR: ${{ github.workspace }}/dist/release-assets
          FN_KNOCK_RELEASE_HISTORY_FILE: ${{ runner.temp }}/fn-knock-releases.json
          FN_KNOCK_RELEASE_NOTES_PATH: ${{ github.workspace }}/release-notes/${{ needs.preflight.outputs.version }}.md
          FN_KNOCK_VERSION: ${{ needs.preflight.outputs.version }}
          FN_KNOCK_WINDOWS_METADATA_DIR: ${{ runner.temp }}/fn-knock-windows-release
        run: node ./scripts/fn-knock-cos-publish.mjs plan

      - name: Upload complete dry-run/release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fn-knock-${{ needs.preflight.outputs.version }}-release
          path: |
            dist/release-assets/
            dist/cos-publish/
          if-no-files-found: error
          retention-days: 30

      - name: Attest release assets
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/release-assets/*

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Stage draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "${TAG}" --json isDraft,isPrerelease >/tmp/release.json 2>/dev/null; then
            jq -e --argjson prerelease "${PRERELEASE}" \
              '.isDraft == true and .isPrerelease == $prerelease' \
              /tmp/release.json >/dev/null ||
              { echo "Published release ${TAG} already exists; refusing to overwrite it" >&2; exit 1; }
          else
            release_args=(
              --draft
              --verify-tag
              --title "fn-knock ${VERSION}"
              --notes-file "release-notes/${VERSION}.md"
            )
            if [ "${PRERELEASE}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh release create "${TAG}" "${release_args[@]}"
          fi

          find dist/release-assets -maxdepth 1 -type f -exec basename {} \; | sort > /tmp/expected-assets
          gh release view "${TAG}" --json assets --jq '.assets[].name' | sort > /tmp/existing-assets
          comm -23 /tmp/existing-assets /tmp/expected-assets |
            while IFS= read -r stale_asset; do
              [ -n "${stale_asset}" ] || continue
              gh release delete-asset "${TAG}" "${stale_asset}" --yes
            done

          gh release upload "${TAG}" dist/release-assets/* --clobber
          gh release view "${TAG}" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets

      - name: Publish and verify Docker latest
        if: github.event_name == 'push' && needs.preflight.outputs.prerelease != 'true'
        env:
          DOCKER_DIGEST: ${{ needs.docker-manifest.outputs.digest }}
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${FN_KNOCK_DOCKER_IMAGE_REPO}:latest" \
            "${FN_KNOCK_DOCKER_IMAGE_REPO}@${DOCKER_DIGEST}"
          latest="$(docker buildx imagetools inspect "${FN_KNOCK_DOCKER_IMAGE_REPO}:latest")"
          latest_digest="$(printf '%s\n' "${latest}" | awk '/^Digest:/ {print $2; exit}')"
          [ "${latest_digest}" = "${DOCKER_DIGEST}" ] || {
            echo "latest digest ${latest_digest} does not match ${DOCKER_DIGEST}" >&2
            exit 1
          }
          printf '%s\n' "${latest}" | grep -q 'linux/amd64'
          printf '%s\n' "${latest}" | grep -q 'linux/arm64'
          printf '%s\n' "${latest}" | grep -q 'linux/arm/v7'

      - name: Publish to Tencent COS and refresh latest CDN cache
        if: github.event_name == 'push' && needs.preflight.outputs.prerelease != 'true'
        env:
          COS_ACC: ${{ vars.COS_ACC || secrets.COS_ACC }}
          COS_BUCKET: ${{ vars.COS_BUCKET || secrets.COS_BUCKET }}
          COS_PUBLICBASICURL: ${{ vars.COS_PUBLICBASICURL || secrets.COS_PUBLICBASICURL }}
          COS_REGION: ${{ vars.COS_REGION || secrets.COS_REGION }}
          COS_SECRETID: ${{ secrets.COS_SECRETID }}
          COS_SECRETKEY: ${{ secrets.COS_SECRETKEY }}
          FN_KNOCK_COS_OUTPUT_DIR: ${{ github.workspace }}/dist/cos-publish
          FN_KNOCK_INSTALL_SCRIPT: ${{ github.workspace }}/deploy/linux/install.sh
          FN_KNOCK_MACOS_INSTALL_SCRIPT: ${{ github.workspace }}/deploy/macos/install.sh
          FN_KNOCK_LATEST_URL: https://cor.fnknock.cn/latest.json
          FN_KNOCK_RELEASE_ASSETS_DIR: ${{ github.workspace }}/dist/release-assets
          FN_KNOCK_RELEASE_HISTORY_FILE: ${{ runner.temp }}/fn-knock-releases.json
          FN_KNOCK_RELEASE_NOTES_PATH: ${{ github.workspace }}/release-notes/${{ needs.preflight.outputs.version }}.md
          FN_KNOCK_VERSION: ${{ needs.preflight.outputs.version }}
          FN_KNOCK_WINDOWS_METADATA_DIR: ${{ runner.temp }}/fn-knock-windows-release
        run: node ./scripts/fn-knock-cos-publish.mjs publish

      - name: Publish immutable GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          if [ "${PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease
          else
            gh release edit "${TAG}" --draft=false --latest
          fi
