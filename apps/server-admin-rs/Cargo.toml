[package]
name = "server-admin-rs"
# Crate metadata only. The fn-knock product version is defined in ../../version.json.
version = "1.8.8"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
bytes = "1.11"
flate2 = "1.1.9"
get_if_addrs = "0.5"
hex = "0.4"
hmac = "0.12"
http = "1.3"
http-body-util = "0.1"
idna = "1.1"
ipnet = "2.12"
jsonwebtoken = "9.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mime_guess = "2.0"
rand = "0.9"
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager", "streams"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "json", "rustls", "stream"] }
scrypt = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3.53", features = ["formatting", "local-offset", "parsing", "serde"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tokio-rusqlite = { version = "0.7", features = ["bundled", "serde_json"] }
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost"] }
prost = "0.13"
totp-rs = { version = "5.7.2", features = ["gen_secret"] }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["compression-gzip", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.19", features = ["v4"] }
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
webauthn-rs-core = "0.6.1-dev"
x509-parser = "0.18"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"

[build-dependencies]
protoc-bin-vendored = "3"
serde_json = "1.0"
tonic-build = "0.12"
