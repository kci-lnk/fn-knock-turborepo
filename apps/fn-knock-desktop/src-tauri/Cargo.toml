[package]
name = "fn-knock-desktop"
version = "2.0.1"
description = "FnKnock Windows desktop controller"
authors = ["FnKnock"]
edition = "2024"

[lib]
name = "fn_knock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fn-knock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.3"
tauri-plugin-updater = "2.10"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
