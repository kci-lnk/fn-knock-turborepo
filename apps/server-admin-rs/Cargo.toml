[package]
name = "server-admin-rs"
# Crate metadata only. The fn-knock product version is defined in ../../version.json.
version = "2.4.6"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

# Browser runtime checks need release behavior, but do not need the expensive
# whole-program optimization used by distributable artifacts.
[profile.runtime-test]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
bytes = "1.11"
flate2 = "1.1.9"
fn-knock-wol-protocol = { path = "../../packages/wol-protocol-rs" }
get_if_addrs = { package = "if-addrs", version = "0.15" }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }
hickory-proto = "0.26.1"
hex = "0.4"
hmac = "0.12"
http = "1.3"
http-body-util = "0.1"
httpdate = "1.0"
idna = "1.1"
ipnet = "2.12"
num-traits = "0.2"
regex = "1.12"
jsonwebtoken = "9.3"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mime = "0.3"
mime_guess = "2.0"
native-tls = { version = "0.2.18", features = ["vendored"] }
rand = "0.9"
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager", "streams"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "json", "query", "rustls", "stream"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
russh = { version = "0.62.4", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scrypt = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3.53", features = ["formatting", "local-offset", "parsing", "serde"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-rusqlite = { version = "0.7", features = ["bundled", "serde_json"] }
toml = "0.9.12"
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost"] }
tonic-health = "0.12"
prost = "0.13"
totp-rs = { version = "5.7.2", features = ["gen_secret"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.19", features = ["v4"] }
utoipa = "5.4.0"
utoipa-axum = "0.2.0"
vt100 = { path = "../../third_party/vt100" }
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation", "danger-credential-internals", "workaround-google-passkey-specific-issues"] }
webauthn-rs-core = "0.6.1-dev"
x509-parser = { version = "0.18", features = ["verify"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rcgen = { version = "0.14.8", features = ["pem", "x509-parser"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9.0"

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
rcgen = { version = "0.14.8", features = ["pem", "x509-parser"] }
ring = "0.17"
tempfile = "3.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[build-dependencies]
protoc-bin-vendored = "3"
serde_json = "1.0"
tonic-build = "0.12"
utoipa-swagger-ui-vendored = "0.1.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
