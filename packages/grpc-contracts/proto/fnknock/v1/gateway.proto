  // Deprecated compatibility input. New control planes send policy.
  repeated string cidrs = 2 [deprecated = true];
  string updated_at = 3;
  string policy_id = 4;
  CompiledIpSet policy = 5;
}

message OmitTargetsConfig {
  bool enabled = 1;
  repeated string omit_targets = 2;
  string updated_at = 3;
}

message CrawlerBlockerConfig {
  bool enabled = 1;
