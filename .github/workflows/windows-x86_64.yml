name: Windows x86_64

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-unsigned:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Checkout current Go gateway main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kci-lnk/Go-Reauth-Proxy
          path: Go-Reauth-Proxy
          ref: main
          persist-credentials: false

      - name: Record frozen Go commit
        shell: pwsh
        run: |
          $commit = (git -C Go-Reauth-Proxy rev-parse HEAD).Trim()
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve Go-Reauth-Proxy/main"
          }
          "FN_KNOCK_GO_SOURCE_COMMIT=$commit" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go-Reauth-Proxy/go.mod
          cache-dependency-path: Go-Reauth-Proxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --global npm@10.8.2
          npm ci
          choco install nsis --no-progress -y

      - name: Build unsigned native runtime and installer
        shell: pwsh
        run: >-
          ./scripts/fn-knock-windows.ps1
          -Mode Build
          -BundleInstaller
          -RequireCleanTree
          -GoRepository "${{ github.workspace }}\Go-Reauth-Proxy"

      - name: Upload manual verification artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fn-knock-windows-x86_64-unsigned
          path: dist/windows/*-unsigned-setup.exe
          if-no-files-found: error
          retention-days: 14
