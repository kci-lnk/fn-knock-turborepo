[package]
name = "fn-knock-desktop"
version = "2.3.1"
description = "Knock 敲门 Windows 管理程序"
authors = ["KCI-LNK Corporation"]
edition = "2024"

[lib]
name = "fn_knock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fn-knock"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0"
winres = "0.1"

[dependencies]
dirs = "6.0"
hex = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
