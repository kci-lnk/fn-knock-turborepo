[[permission]]
identifier = "status-commands"
description = "Allows the bundled status window to inspect and repair the FnKnock Windows service."
commands.allow = [
  "get_status",
  "open_admin",
  "start_service",
  "restart_service",
  "save_runtime_config",
  "check_for_update",
  "install_update",
  "export_diagnostics",
]
